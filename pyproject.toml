[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hermes-graphiti"
version = "0.1.0"
description = "Temporal knowledge-graph memory provider for Hermes Agent (Graphiti / Zep)"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "graphiti-core>=0.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
sqlite = ["graphiti-core[sqlite]>=0.3"]
dev = ["pytest>=8.0", "pytest-asyncio"]

[project.entry-points."hermes.memory.providers"]
graphiti = "plugins.memory.graphiti:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
