name: graphiti
version: "0.1.0"
description: >
  Temporal knowledge-graph memory provider powered by Graphiti (Zep).
  Stores entities, relationships, and bi-temporal validity windows.
  Surfaces a recall-trigger index in MEMORY.md and supports hybrid
  (vector + BM25 + graph traversal) retrieval.
author: djhenry
min_hermes_version: "1.0.0"
type: memory_provider
hooks:
  - initialize
  - prefetch
  - sync_turn
  - handle_tool_call
  - get_tool_schemas
  - on_memory_write
  - on_session_end
  - system_prompt_block
  - shutdown
  - post_setup
entrypoint: plugins.memory.graphiti:register
backends:
  - neo4j        # primary — Docker/cloud, recommended for production
  - kuzu         # embedded, no Docker, Python 3.11+ (deprecated upstream)
  - falkordblite # embedded, no Docker, Python 3.12+ (recommended for offline)
