name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install plugin (no hermes-agent needed for unit tests)
        run: pip install -e ".[dev]" -q

      - name: Unit tests
        run: python3 -m pytest tests/test_memory_index.py -v

  integration:
    name: Integration tests (mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install hermes-agent + plugin
        run: make install

      - name: Integration tests
        run: python3 -m pytest tests/integration/ -v -m "not live"

  live:
    name: Live tests (FalkorDB Lite + OpenRouter)
    runs-on: ubuntu-latest
    # Forks and dependabot PRs won't have the secret — the test itself skips
    # gracefully when OPENAI_API_KEY is empty (pytest.skip inside the test).
    env:
      GRAPHITI_USE_FALKORDB_LITE: "1"
      # OpenRouter is OpenAI-API-compatible — point the base URL and use any free model.
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      GRAPHITI_EXTRACTION_MODEL: openrouter/free
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install plugin with FalkorDB Lite backend
        run: pip install -e ".[falkordblite,dev]" -q && make install-hermes

      - name: Live integration tests
        run: python3 -m pytest tests/integration/ -v -m "live" --timeout=180 -s --log-cli-level=WARNING
